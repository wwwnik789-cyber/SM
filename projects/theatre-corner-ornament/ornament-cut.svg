<title>Левый верхний угол фотозоны — резной орнамент 250 мм</title>
<desc>Авторская векторная интерпретация по небольшому референсу, не точная копия. Контур без компенсации фрезы. Декоративные линии в визуальной версии не являются путями сквозной резки.</desc>
