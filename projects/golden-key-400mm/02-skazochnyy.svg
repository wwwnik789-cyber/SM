<title>Ключик 02-skazochnyy — контур фрезеровки 400 мм</title>
<desc>Единственный замкнутый контур детали. Габарит по ширине 400 мм, без припуска на инструмент; склеить две детали зеркальными лицевыми сторонами наружу. Контур симметричен относительно продольной оси.</desc>
