<!doctype html>
<!-- СНИППЕТ 06 · Липкая кнопка для мобильных
     Куда: блок T123 в самом низу страницы (после футера).
     Показывается только на экранах до 860px, чтобы не мешать десктопу.
     Замените номер телефона и якорь #lead на свои. -->
<style>
  .ny-sticky{position:fixed; z-index:9999; left:12px; right:12px; bottom:12px; display:none; gap:10px}
  @media (max-width:860px){ .ny-sticky{display:flex} }
  .ny-sticky a{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:999px;
    padding:14px 16px; font-weight:800; font-size:14.5px; text-decoration:none;
    font-family:"Manrope",system-ui,sans-serif; border:1px solid transparent;
    box-shadow:0 10px 28px -12px rgba(0,0,0,.35)}
  .ny-sticky .ny-call{background:#fff; color:#14161a; border-color:#e4e2dd}
  .ny-sticky .ny-lead{background:#ff4d1c; color:#fff}
  body{padding-bottom:76px}
  @media (min-width:861px){ body{padding-bottom:0} }
</style>
<div class="ny-sticky">
  <a class="ny-call" href="tel:+84957990019">Позвонить</a>
  <a class="ny-lead" href="#lead">Смета за 1 час</a>
</div>
